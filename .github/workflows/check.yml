# .github/workflows/check.yml
name: Check

on:
  push:
    branches: [main]
  pull_request:

# Runs for the same ref queue instead of overlapping, so two pushes to main
# can never run production migrations/deploys at the same time and an older
# commit can't finish deploying after a newer one. In-progress runs are never
# cancelled (that could stop a deploy half-way).
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: uv sync --extra test

      - name: Type check
        run: uvx ty@0.0.84 check src/

      - name: Lint
        run: uvx ruff@0.16.0 check src/ tests/

      - name: Format check
        run: uvx ruff@0.16.0 format --check src/ tests/

      - name: Dead code detection
        run: uvx --python 3.12 vulture src/ vulture_whitelist.py

      # detect-secrets-hook exits non-zero on any secret not in the baseline.
      # (`detect-secrets scan --baseline` exits 0 and adds new secrets to the
      # baseline, so it could never fail.) Same version as .pre-commit-config.yaml.
      - name: Secrets scan
        run: git ls-files -z | xargs -0 uvx --from detect-secrets==1.5.0 detect-secrets-hook --baseline .secrets.baseline  # pragma: allowlist secret

      - name: Dependency audit
        run: uvx pip-audit --strict --desc || true  # Advisory — don't block on upstream CVEs

      - name: Duplicate code detection
        run: npx jscpd src/ --min-lines 10 --min-tokens 50 --threshold 5

      - name: Validate migrations against SQLite
        run: uv run pytest tests/unit/test_migration_schema.py -v --tb=short

      - name: "Unit + integration tests with coverage (floor: 80%)"
        run: uv run pytest tests/unit tests/integration -v --tb=short --cov=src --cov-report=xml --cov-fail-under=80

      - name: Frontend tests (vitest)
        run: |
          npm ci
          npm test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: coverage.xml

      # Fails on any migration error except the known "already applied" ones,
      # so a broken migration stops the deploy below.
      - name: Run migrations (on main)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            scripts/run_migrations.sh planetcf wrangler.production.jsonc --remote
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # pywrangler sync vendors the pyproject dependencies (feedparser, jinja2,
      # bleach, ...) into python_modules/, which wrangler bundles. Without it
      # the upload contains only src/ (16 modules instead of 236).
      - name: Deploy (on main)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            uv run --group workers pywrangler sync
            npx wrangler deploy -c wrangler.production.jsonc
          else
            echo "Skipping deploy: CLOUDFLARE_API_TOKEN not set"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
