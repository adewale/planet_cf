# .github/workflows/check.yml
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # Pin uv so the toolchain doesn't drift between CI runs (M-T6).
          version: "0.5.18"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: uv sync --extra test

      # Tool versions below are pinned (M-T6) so CI doesn't drift when a new
      # release of ty/ruff/vulture/detect-secrets/jscpd lands upstream. Keep
      # these in sync with .pre-commit-config.yaml.
      - name: Type check
        run: uvx ty@0.0.49 check src/

      - name: Lint
        run: uvx ruff@0.9.2 check src/ tests/

      - name: Format check
        run: uvx ruff@0.9.2 format --check src/ tests/

      - name: Dead code detection
        run: uvx --python 3.12 vulture@2.14 src/ vulture_whitelist.py

      - name: Secrets scan
        run: uvx detect-secrets@1.5.0 scan --baseline .secrets.baseline

      - name: Dependency audit
        run: uvx pip-audit --strict --desc || true  # Advisory — don't block on upstream CVEs

      - name: Duplicate code detection
        run: npx jscpd@4.0.5 src/ --min-lines 10 --min-tokens 50 --threshold 5

      - name: Validate migrations against SQLite
        run: uv run pytest tests/unit/test_migration_schema.py -v --tb=short

      - name: Unit tests
        run: uv run pytest tests/unit -v --tb=short

      - name: Integration tests
        run: uv run pytest tests/integration -v --tb=short

      - name: JS tests (vitest)
        run: npm test

      - name: "Coverage report (floor: 80%)"
        run: uv run pytest tests/unit tests/integration --cov=src --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: coverage.xml

      - name: Run migrations (on main)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            for migration in migrations/*.sql; do
              echo "Running: $(basename "$migration")"
              # Capture wrangler's OUTPUT (not the exit code) so we can tell an
              # "already applied" no-op from a real failure. The old code grepped
              # "$?" (the numeric exit code) for "already exists", which never
              # matched, so EVERY failure was swallowed and the deploy below ran
              # against a possibly un-migrated schema (H8a). We also pin the
              # config to wrangler.production.jsonc so migrations target the same
              # database_id the deploy step uses.
              if ! output="$(npx wrangler d1 execute planetcf --remote \
                  --file "$migration" -c wrangler.production.jsonc 2>&1)"; then
                if echo "$output" | grep -qiE "already exists|duplicate column"; then
                  echo "  Already applied (tolerated)"
                else
                  echo "  FAILED: $(basename "$migration")"
                  echo "$output"
                  exit 1
                fi
              else
                echo "  Applied"
              fi
            done
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy (on main)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            # H8c: Cloudflare Python Workers need their pip dependencies vendored
            # into `python_modules/` (feedparser/jinja2/bleach/markupsafe).
            # `scripts/deploy_instance.sh` and README step 2 both treat this bundle
            # as REQUIRED, but this job never builds it.
            #
            # We can't reliably BUILD it here. `make python-modules` only copies
            # packages out of a pre-built Pyodide virtualenv at
            # `.venv-workers/pyodide-venv/`; that venv is produced by the
            # Cloudflare Workers tooling (the `workers` dependency group in
            # pyproject.toml), NOT by `uv sync` (README "Note on wrangler" / re-audit
            # H9.2 — the "run uv sync to create it" hint is circular). No script,
            # Makefile target, or documented command in this repo provisions that
            # venv from a clean checkout, so there is no trustworthy build sequence
            # to run here.
            #
            # The previous fix only emitted a `::warning::`, which still let a
            # worker missing its dependencies ship to production (ImportError on
            # every request). Instead we FAIL HARD when the bundle is absent or
            # incomplete, so a broken deploy is impossible. We mirror the exact
            # REQUIRED_PACKAGES guard from deploy_instance.sh:339-357.
            #
            # TO ENABLE A REAL BUILD STEP (and replace this guard): provision the
            # pyodide venv before deploying — either commit/cache a pre-built
            # `python_modules/` (or `.venv-workers/pyodide-venv/`) and restore it
            # here, or add a documented command that builds the venv via the
            # `workers` group, then run `make python-modules` ahead of this step.
            MISSING=""
            if [ ! -d "python_modules" ]; then
              MISSING="python_modules/ directory is absent"
            else
              for pkg in feedparser jinja2 bleach markupsafe; do
                if [ ! -d "python_modules/$pkg" ]; then
                  MISSING="${MISSING}${MISSING:+, }missing package: $pkg"
                fi
              done
            fi
            if [ -n "$MISSING" ]; then
              echo "::error::Refusing to deploy: vendored Python dependency bundle is not ready ($MISSING)."
              echo "::error::Cloudflare Python Workers require python_modules/ with feedparser, jinja2, bleach, markupsafe."
              echo "::error::Build it with 'make python-modules' (needs the pre-built .venv-workers/pyodide-venv from the"
              echo "::error::'workers' dependency group), or restore a cached/committed bundle before this step. See H8c."
              exit 1
            fi
            npx wrangler deploy -c wrangler.production.jsonc
          else
            echo "Skipping deploy: CLOUDFLARE_API_TOKEN not set"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
