# .github/workflows/e2e.yml
# End-to-end tests against real Cloudflare infrastructure.
#
# This workflow runs E2E tests against a deployed test-planet instance.
# It requires:
#   - CLOUDFLARE_API_TOKEN: API token with Workers, D1, Vectorize, Queues access
#   - TEST_PLANET_URL: The deployed test-planet URL (e.g., https://test-planet.account.workers.dev)
#
# The test-planet instance must be set up first:
#   ./scripts/setup_test_planet.sh
name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      seed_data:
        description: 'Re-seed test data before running tests'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'migrations/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Only run if Cloudflare credentials are available
    if: github.repository == 'adewale/planet_cf' || github.event_name == 'workflow_dispatch'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Job-level so it's visible to step `if:` conditions (M-T2 reachability guard).
      E2E_BASE_URL: ${{ secrets.TEST_PLANET_URL }}

    steps:
      - name: Check credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping E2E tests. Add it as a repository secret to enable."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: astral-sh/setup-uv@v5
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '20'

      - name: Install dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          uv sync --extra test
          npm install wrangler@4.58.0  # Pin so `npx wrangler` is reproducible (M-T6)

      # Generate a fresh, random SESSION_SECRET once per run and reuse the SAME
      # value for (a) the deployed test worker and (b) the seeding/test steps that
      # mint signed admin cookies. This replaces the deterministic committed secret
      # "test-session-secret-for-e2e-testing-only" that previously protected a live,
      # publicly routable full-mode worker (H12). The value lives only in this job's
      # environment and is masked in logs via ::add-mask::.
      - name: Generate test session secret
        if: env.CLOUDFLARE_API_TOKEN != ''
        id: gen_secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "E2E_SESSION_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Set worker SESSION_SECRET
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          printf '%s' "$E2E_SESSION_SECRET" | npx wrangler secret put SESSION_SECRET \
            --config examples/test-planet/wrangler.jsonc

      - name: Seed test data
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event.inputs.seed_data != 'false'
        env:
          SESSION_SECRET: ${{ env.E2E_SESSION_SECRET }}
        run: |
          uv run python scripts/seed_test_data.py \
            --db-name test-planet-db \
            --config examples/test-planet/wrangler.jsonc

      # M-T2: the e2e tier silently skips every test when no live worker answers,
      # so the job can be green while testing nothing. Fail if the target health
      # endpoint is unreachable. TEST_PLANET_URL (-> E2E_BASE_URL) may be empty in
      # forks; only enforce when it's set, so this never fails a legitimately
      # unconfigured run. E2E_BASE_URL is job-level so it's visible here in `if:`.
      - name: Verify test worker is reachable
        if: env.CLOUDFLARE_API_TOKEN != '' && env.E2E_BASE_URL != ''
        run: |
          echo "Probing ${E2E_BASE_URL%/}/health ..."
          if ! curl -sSf --max-time 30 "${E2E_BASE_URL%/}/health" >/dev/null; then
            echo "::error::E2E target ${E2E_BASE_URL%/}/health is unreachable —"
            echo "::error::refusing to report a green run against a worker that isn't up."
            exit 1
          fi
          echo "Health endpoint reachable."

      - name: Run E2E tests
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          # E2E_BASE_URL comes from job-level env; E2E_SESSION_SECRET is provided
          # via $GITHUB_ENV by the "Generate test session secret" step above.
          E2E_ADMIN_USERNAME: "testadmin"
          RUN_E2E_TESTS: "1"
        run: |
          uv run pytest tests/e2e/ -v --tb=short -x --ignore=tests/e2e/test_browser.py

  browser-e2e:
    runs-on: ubuntu-latest
    if: github.repository == 'adewale/planet_cf' || github.event_name == 'workflow_dispatch'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping browser E2E tests."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: astral-sh/setup-uv@v5
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '20'

      - name: Install dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          uv sync --extra test
          npm install -g agent-browser@0.27.3  # Pin so browser tooling doesn't drift (M-T6)
          agent-browser install

      - name: Run browser E2E tests
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          E2E_BASE_URL: ${{ secrets.TEST_PLANET_URL }}
        run: |
          uv run pytest tests/e2e/test_browser.py -v --tb=short -x

      - name: Upload screenshots
        if: always() && env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/e2e/screenshots/
          if-no-files-found: ignore
